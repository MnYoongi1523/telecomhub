# Especificación de los servicios web de TelecomHub API.
# Archivo generado con: npm run docs:openapi
# La misma especificación está disponible en http://localhost:3001/api/documentacion

openapi: "3.0.3"
info:
  title: "TelecomHub API"
  version: "1.0.0"
  description: "Servicios web del software de gestión TelecomHub: autenticación, clientes, planes de servicio, vendedores, contratos, facturación, pagos, soporte e indicadores."
servers:
    - url: "http://localhost:3001"
      description: "Servidor local de desarrollo"
tags:
    - name: "General"
      description: "Estado del servicio y documentación"
    - name: "Autenticación"
      description: "Registro, inicio de sesión y perfil"
    - name: "Dashboard"
      description: "Indicadores y reportes"
    - name: "Administración"
      description: "Usuarios del sistema y roles"
    - name: "Planes"
      description: "Catálogo de planes de servicio"
    - name: "Clientes"
      description: "Clientes del servicio de internet"
    - name: "Vendedores"
      description: "Asesores comerciales"
    - name: "Contratos"
      description: "Contratos de servicio"
    - name: "Facturas"
      description: "Facturación mensual"
    - name: "Pagos"
      description: "Pagos de facturas"
    - name: "Soporte"
      description: "Tickets de soporte"
components:
  securitySchemes:
    bearerAuth:
      type: "http"
      scheme: "bearer"
      bearerFormat: "JWT"
  schemas:
    Error:
      type: "object"
      properties:
        ok:
          type: "boolean"
          example: false
        mensaje:
          type: "string"
        error:
          type: "string"
          description: "Código de error"
    Cliente:
      type: "object"
      properties:
        id:
          type: "integer"
          example: 1
        nombre:
          type: "string"
          example: "Carlos Mendoza"
        cedula:
          type: "string"
          example: "1010203040"
        telefono:
          type: "string"
          example: "+57 300 123 4567"
        correo:
          type: "string"
          example: "carlos.mendoza@correo.com"
        planId:
          type: "integer"
          example: 2
        plan:
          type: "string"
          description: "Nombre del plan (solo lectura)"
          example: "Fibra 300MB"
        direccion:
          type: "string"
        estado:
          type: "string"
          enum:
              - "Activo"
              - "Suspendido"
        contratosActivos:
          type: "integer"
    Plan:
      type: "object"
      properties:
        id:
          type: "integer"
          example: 1
        nombre:
          type: "string"
          example: "Fibra 100MB"
        velocidad:
          type: "integer"
          description: "Mbps"
          example: 100
        precio:
          type: "number"
          description: "Valor mensual en pesos"
          example: 65000
        tipo:
          type: "string"
          enum:
              - "Fibra"
              - "Banda Ancha"
              - "Cable"
              - "Inalámbrico"
        estado:
          type: "string"
          enum:
              - "Activo"
              - "Inactivo"
    Vendedor:
      type: "object"
      properties:
        id:
          type: "integer"
        nombre:
          type: "string"
        cedula:
          type: "string"
        telefono:
          type: "string"
        correo:
          type: "string"
        estado:
          type: "string"
          enum:
              - "Activo"
              - "Inactivo"
    Contrato:
      type: "object"
      properties:
        id:
          type: "integer"
        clienteId:
          type: "integer"
        planId:
          type: "integer"
        vendedorId:
          type: "integer"
        cliente:
          type: "string"
          description: "Nombre del cliente (solo lectura)"
        plan:
          type: "string"
        vendedor:
          type: "string"
        inicio:
          type: "string"
          format: "date"
        fin:
          type: "string"
          format: "date"
          description: "Fecha calculada de finalización"
        diasRestantes:
          type: "integer"
        vigenciaMeses:
          type: "integer"
          enum:
              - 6
              - 12
              - 24
        valorMensual:
          type: "number"
        cancelado:
          type: "boolean"
        estado:
          type: "string"
          enum:
              - "Vigente"
              - "Por vencer"
              - "Finalizado"
              - "Cancelado"
          description: "Estado calculado a partir de las fechas"
    Factura:
      type: "object"
      properties:
        id:
          type: "integer"
        contratoId:
          type: "integer"
        clienteId:
          type: "integer"
        planId:
          type: "integer"
        cliente:
          type: "string"
        plan:
          type: "string"
        valor:
          type: "number"
        emision:
          type: "string"
          format: "date"
        vencimiento:
          type: "string"
          format: "date"
        diasParaVencer:
          type: "integer"
        pagada:
          type: "boolean"
        estado:
          type: "string"
          enum:
              - "Pagada"
              - "Pendiente"
              - "Vencida"
    Pago:
      type: "object"
      properties:
        id:
          type: "integer"
        facturaId:
          type: "integer"
        clienteId:
          type: "integer"
        cliente:
          type: "string"
        valor:
          type: "number"
        fecha:
          type: "string"
          format: "date"
        metodo:
          type: "string"
          enum:
              - "Efectivo"
              - "Transferencia"
              - "Tarjeta"
    Ticket:
      type: "object"
      properties:
        id:
          type: "integer"
        clienteId:
          type: "integer"
        cliente:
          type: "string"
        asunto:
          type: "string"
        descripcion:
          type: "string"
        prioridad:
          type: "string"
          enum:
              - "Alta"
              - "Media"
              - "Baja"
        estado:
          type: "string"
          enum:
              - "Abierto"
              - "En proceso"
              - "Resuelto"
        fecha:
          type: "string"
          format: "date"
    Usuario:
      type: "object"
      properties:
        id:
          type: "integer"
        nombre:
          type: "string"
        username:
          type: "string"
        rol:
          type: "string"
          enum:
              - "Administrador"
              - "Supervisor"
              - "Soporte Técnico"
        estado:
          type: "string"
          enum:
              - "Activo"
              - "Inactivo"
        creadoEn:
          type: "string"
          format: "date-time"
security:
    - bearerAuth: []
paths:
  /api/salud:
    get:
      tags:
          - "General"
      summary: "Verificar que el servicio está en línea"
      security: []
      responses:
        200:
          description: "Servicio disponible"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                  mensaje:
                    type: "string"
                  version:
                    type: "string"
  /api/documentacion:
    get:
      tags:
          - "General"
      summary: "Especificación OpenAPI de todos los servicios"
      security: []
      responses:
        200:
          description: "Documentación en formato OpenAPI 3.0"
  /api/servicios:
    get:
      tags:
          - "General"
      summary: "Catálogo de servicios web agrupados por módulo"
      responses:
        200:
          description: "Listado de rutas disponibles"
  /api/auth/registro:
    post:
      tags:
          - "Autenticación"
      summary: "Registrar un usuario en el sistema"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                username:
                  type: "string"
                  minLength: 3
                  example: "operador"
                password:
                  type: "string"
                  minLength: 6
                  example: "Clave123"
                nombre:
                  type: "string"
                  example: "Operador de pruebas"
                rol:
                  type: "string"
                  enum:
                      - "Administrador"
                      - "Supervisor"
                      - "Soporte Técnico"
              required:
                  - "username"
                  - "password"
      responses:
        201:
          description: "Usuario creado"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  mensaje:
                    type: "string"
                  data:
                    $ref: "#/components/schemas/Usuario"
        400:
          description: "Los datos enviados no cumplen las reglas de validación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: "Falta el token de autenticación o las credenciales no son válidas"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: "El rol del usuario no tiene permiso para la operación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: "El recurso solicitado no existe"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        409:
          description: "Conflicto: el recurso ya existe o está en uso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/login:
    post:
      tags:
          - "Autenticación"
      summary: "Iniciar sesión con usuario y contraseña"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                username:
                  type: "string"
                  example: "administrador"
                password:
                  type: "string"
                  example: "Admin123"
              required:
                  - "username"
                  - "password"
      responses:
        200:
          description: "Autenticación satisfactoria, devuelve el token de acceso"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                  mensaje:
                    type: "string"
                    example: "Autenticación satisfactoria. Bienvenido."
                  data:
                    type: "object"
                    properties:
                      token:
                        type: "string"
                      usuario:
                        $ref: "#/components/schemas/Usuario"
        400:
          description: "Los datos enviados no cumplen las reglas de validación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: "Falta el token de autenticación o las credenciales no son válidas"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: "El rol del usuario no tiene permiso para la operación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: "El recurso solicitado no existe"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        409:
          description: "Conflicto: el recurso ya existe o está en uso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/auth/perfil:
    get:
      tags:
          - "Autenticación"
      summary: "Consultar el perfil del usuario autenticado"
      responses:
        200:
          description: "Perfil del usuario"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  mensaje:
                    type: "string"
                  data:
                    $ref: "#/components/schemas/Usuario"
        400:
          description: "Los datos enviados no cumplen las reglas de validación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: "Falta el token de autenticación o las credenciales no son válidas"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: "El rol del usuario no tiene permiso para la operación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: "El recurso solicitado no existe"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        409:
          description: "Conflicto: el recurso ya existe o está en uso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/dashboard:
    get:
      tags:
          - "Dashboard"
      summary: "Resumen de gestión para la pantalla principal"
      responses:
        200:
          description: "Indicadores y últimas novedades"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  mensaje:
                    type: "string"
                  data:
                    $ref: "#/components/schemas/Error"
        400:
          description: "Los datos enviados no cumplen las reglas de validación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: "Falta el token de autenticación o las credenciales no son válidas"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: "El rol del usuario no tiene permiso para la operación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: "El recurso solicitado no existe"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        409:
          description: "Conflicto: el recurso ya existe o está en uso"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /api/dashboard/indicadores:
    get:
      tags:
          - "Dashboard"
      summary: "Indicadores numéricos del negocio"
      responses:
        200:
          description: "Totales de clientes, contratos, facturación, pagos y soporte"
        400:
          description: "Los datos enviados no cumplen las reglas de validación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: "Falta el token de autenticación o las credenciales no son válidas"
          content:
            application/json:
