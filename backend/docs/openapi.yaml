                  type: "string"
                password:
                  type: "string"
                rol:
                  type: "string"
                estado:
                  type: "string"
              required: []
      responses:
        200:
          description: "Usuario actualizado"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  mensaje:
                    type: "string"
                  data:
                    $ref: "#/components/schemas/Usuario"
        400:
          description: "Los datos enviados no cumplen las reglas de validación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: "Falta el token de autenticación o las credenciales no son válidas"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: "El rol del usuario no tiene permiso para la operación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        404:
          description: "El recurso solicitado no existe"
          content:
