  /api/usuarios:
    get:
      tags:
          - "Administración"
      summary: "Listar usuarios del sistema"
      parameters:
          - name: "estado"
            in: "query"
            schema:
              type: "string"
              enum:
                  - "Activo"
                  - "Inactivo"
          - name: "rol"
            in: "query"
            schema:
              type: "string"
          - name: "busqueda"
            in: "query"
            schema:
              type: "string"
      responses:
        200:
          description: "Usuarios del sistema"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  mensaje:
                    type: "string"
                  total:
                    type: "integer"
                  data:
                    type: "array"
                    items:
                      $ref: "#/components/schemas/Usuario"
        400:
          description: "Los datos enviados no cumplen las reglas de validación"
          content:
            application/json:
              schema:
