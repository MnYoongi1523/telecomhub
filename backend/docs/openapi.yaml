        required: true
        content:
          application/json:
            schema:
              type: "object"
              properties:
                nombre:
                  type: "string"
                username:
                  type: "string"
                  minLength: 4
                password:
                  type: "string"
                  minLength: 6
                rol:
                  type: "string"
                  enum:
                      - "Administrador"
                      - "Supervisor"
                      - "Soporte Técnico"
                estado:
                  type: "string"
                  enum:
                      - "Activo"
                      - "Inactivo"
              required:
                  - "nombre"
                  - "username"
                  - "password"
                  - "rol"
                  - "estado"
      responses:
        201:
          description: "Usuario creado"
          content:
            application/json:
              schema:
                type: "object"
                properties:
                  ok:
                    type: "boolean"
                    example: true
                  mensaje:
                    type: "string"
                  data:
                    $ref: "#/components/schemas/Usuario"
        400:
          description: "Los datos enviados no cumplen las reglas de validación"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        401:
          description: "Falta el token de autenticación o las credenciales no son válidas"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        403:
          description: "El rol del usuario no tiene permiso para la operación"
          content:
            application/json:
              schema:
